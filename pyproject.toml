[project]
name = "nzgeo"
version = "0.5.0"
description = "NZ Site Hazards: site wind speeds, geotechnical desk study and initial geotechnical assessment reports"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "shapely>=2.0", "pyproj>=3.6", "numpy>=1.26", "scipy>=1.11", "pillow>=10", "jinja2>=3.1",
                "fastapi>=0.110", "uvicorn>=0.29", "cryptography>=42", "keyring>=24", "h5py>=3.10", "openpyxl>=3.1",
                "python-multipart>=0.0.9", "pillow-heif>=0.16", "python-docx>=1.1", "matplotlib>=3.8", "rasterio>=1.3", "geopandas>=0.14"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["nzgeo", "nzwind", "nzwind.auto"]

[tool.setuptools.package-data]
nzgeo = ["data/*.json", "data/*.enc", "data/*.gz", "data/ts1170_5/*", "static/leaflet/*", "static/leaflet/images/*"]
nzwind = ["data/*.enc", "web/*", "web/vendor/*", "web/vendor/fonts/*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
